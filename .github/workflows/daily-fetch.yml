name: Daily ArXiv Paper Fetch

on:
  schedule:
    # Announcement: Sun–Thu 20:00 America/New_York. DST handled by GitHub.
    - cron: "5 20 * * 0-4"
      timezone: "America/New_York"
    # Independent opportunities if the first schedule is delayed/dropped.
    - cron: "25,45 20 * * 0-4"
      timezone: "America/New_York"
    - cron: "5,35 21 * * 0-4"
      timezone: "America/New_York"
    # Later refresh catches delayed announcements/RSS and enriches affiliations.
    - cron: "10 0 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch: # Manual trigger for testing
    inputs:
      quick:
        description: "Compatibility flag: all runs now publish immediately, then enrich affiliations"
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: interest-profile
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    outputs:
      new_issue: ${{ steps.generate.outputs.new_issue }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: src
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      CLOUDFLARE_FEEDBACK_API_URL: ${{ vars.CLOUDFLARE_FEEDBACK_API_URL }}
      CLOUDFLARE_FEEDBACK_SYNC_TOKEN: ${{ secrets.CLOUDFLARE_FEEDBACK_SYNC_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Prepare config
        env:
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: bash .github/scripts/prepare-config.sh

      - name: Restore incremental paper caches
        uses: actions/cache@v4
        with:
          path: data/cache
          key: paper-cache-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: paper-cache-v1-${{ github.ref_name }}-

      - name: Sync feedback and generate one snapshot
        id: generate
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          ARXIV_QUERY: ${{ secrets.ARXIV_QUERY }}
          MAX_PAPER_NUM: ${{ secrets.MAX_PAPER_NUM }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          AFFILIATION_MAX_PAPERS: ${{ vars.AFFILIATION_MAX_PAPERS }}
          AFFILIATION_MAX_LLM_PAPERS: ${{ vars.AFFILIATION_MAX_LLM_PAPERS }}
          HF_FALLBACK_DAYS: ${{ vars.HF_FALLBACK_DAYS }}
          # Publish the new issue promptly; enrich its selected papers below.
          AFFILIATION_BUDGET_SECONDS: '0'
        run: |
          python -m zotero_arxiv_daily.delivery_state --recover
          python -m zotero_arxiv_daily.daily

      - name: Persist feedback and run history
        run: |
          if [[ -n "$(git status --short data/interest_profile.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/interest_profile.json
            git commit -m "Persist daily recommendation snapshot and feedback"
            git push
          fi

      - name: Acknowledge committed feedback
        env:
          ACKNOWLEDGE_PROCESSED_FEEDBACK: "true"
        run: python -m zotero_arxiv_daily.feedback_sync

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
          VITE_FEEDBACK_API_URL: ${{ vars.CLOUDFLARE_FEEDBACK_API_URL }}
        run: npm run build

      - name: Copy papers.json to build output
        run: cp data/papers.json frontend/dist/papers.json

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5.0.0

      - name: Persist successfully published paper IDs
        run: |
          python -m zotero_arxiv_daily.delivery_state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/interest_profile.json
          if ! git diff --cached --quiet; then
            git commit -m "Record published recommendation IDs"
            git push
          fi

      - name: Enrich published paper affiliations
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          AFFILIATION_MAX_PAPERS: ${{ vars.AFFILIATION_MAX_PAPERS }}
          AFFILIATION_MAX_LLM_PAPERS: ${{ vars.AFFILIATION_MAX_LLM_PAPERS }}
          AFFILIATION_BUDGET_SECONDS: ${{ vars.AFFILIATION_BUDGET_SECONDS || '900' }}
          AFFILIATION_INCLUDE_CANDIDATES: ${{ github.event.schedule == '10 0 * * 1-5' && 'true' || 'false' }}
        run: |
          python -m zotero_arxiv_daily.affiliation_refresh
          cp data/papers.json frontend/dist/papers.json

      - name: Upload enriched Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: github-pages-enriched
          path: frontend/dist

      - name: Deploy enriched affiliations
        uses: actions/deploy-pages@v5.0.0
        with:
          artifact_name: github-pages-enriched

      - name: Persist published affiliation metadata
        run: |
          python -m zotero_arxiv_daily.delivery_state
          git add data/interest_profile.json
          if ! git diff --cached --quiet; then
            git commit -m "Record published affiliation metadata"
            git push
          fi

      - name: Upload shared recommendation snapshot
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-snapshot
          path: data/papers.json
          retention-days: 30

      - name: Verify announced paper freshness
        run: python -m zotero_arxiv_daily.schedule_health --verify

  send-email:
    needs: fetch-and-deploy
    if: github.event.schedule != '10 0 * * 1-5' && needs.fetch-and-deploy.outputs.new_issue == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Check email configuration
        id: email-config
        env:
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: bash .github/scripts/check-email-config.sh
      - uses: actions/setup-python@v6.3.0
        if: steps.email-config.outputs.enabled == 'true'
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        if: steps.email-config.outputs.enabled == 'true'
        with:
          name: recommendation-snapshot
          path: data
      - name: Prepare config
        if: steps.email-config.outputs.enabled == 'true'
        env:
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: bash .github/scripts/prepare-config.sh
      - name: Send the deployed snapshot
        if: steps.email-config.outputs.enabled == 'true'
        env:
          PYTHONPATH: src
          GITHUB_REPOSITORY: ${{ github.repository }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.qq.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.SILICONFLOW_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE || 'https://api.siliconflow.cn/v1' }}
          MODEL_NAME: ${{ secrets.MODEL_NAME || 'Qwen/Qwen3-8B' }}
        run: |
          python -m pip install -r scripts/requirements.txt
          python -m zotero_arxiv_daily.snapshot_mail
